id: SSRF_URL_PARAM_INTERNAL_FETCH
info:
  name: "SSRF via URL parameter fetching internal HTTP resources"
  description: "Detects Server-Side Request Forgery when a client-controlled URL parameter causes the server to fetch an attacker-chosen internal HTTP resource and reflect evidence of that fetch in the response."
  details: "APIs that accept callback, webhook, or target URL fields and server-side fetch them are vulnerable to SSRF if destination validation is missing. This test replaces an existing http(s) parameter with an internal URL and checks whether the response includes content obtained from that internal fetch."
  impact: "SSRF can expose internal services, cloud metadata, and sensitive files, and may enable further pivoting."
  category:
    name: SSRF
    shortName: Server Side Request Forgery
    displayName: Server Side Request Forgery (SSRF)
  subCategory: SSRF_URL_PARAM_INTERNAL_FETCH
  severity: HIGH
  agenticTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - "https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa6-server-side-request-forgery.md"
  cwe:
    - CWE-918

attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: FAST

auth:
  authenticated: true

api_selection_filters:
  method:
    neq: OPTIONS
  response_code:
    gte: 200
    lt: 500
  request_payload:
    for_one:
      key:
        regex: (?i)(url|uri|callback|webhook|endpoint|target|api|link|mechanic_api|fetch_url|image_url|href)
        extract: urlKey
      value:
        regex: (?i)^https?://
        extract: originalUrl

wordLists:
  internalTargets:
    - "http://127.0.0.1:8888/workshop/api/shop/return_qr_code"
    - "http://127.0.0.1:8888/workshop/api/mechanic/receive_report?mechanic_code=TRAC_JHN&problem_details=ssrf&vin=0HEHDH01ABD222000"
    - "http://localhost:8888/workshop/api/mechanic/receive_report?mechanic_code=TRAC_JHN&problem_details=ssrf&vin=0HEHDH01ABD222000"
  ssrfEvidence:
    - report_link
    - mechanic_code
    - PNG
    - IHDR
    - response_from_mechanic_api
    - "sent\":true"
    - "sent\": true"

execute:
  type: single
  requests:
    - req:
        - modify_body_param:
            urlKey: ${internalTargets}

validate:
  response_code:
    gte: 200
    lt: 300
  response_payload:
    length:
      gt: 0
    contains_either: ${ssrfEvidence}
    not_contains:
      - Could not connect
      - Invalid URL
      - No scheme supplied
      - SSRF blocked
      - Access Denied
