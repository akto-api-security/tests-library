id: SMART_AUTH_BYPASS_SQL_INJECTION
info:
  name: Authentication Bypass using SQL Injection - Smart Testing
  description: >
    Test authentication bypass via SQL injection in login/auth parameters. Keep
    baseline method, URL, and non-auth headers. Mutate string fields that feed
    authentication (username, password, email, token, otp, or any body/query
    string the baseline uses for login). Leave session Authorization alone unless
    the baseline itself is an unauthenticated login call.
  details: >
    Clone the baseline. Across 4–5+ probes append or replace values with classic
    auth-bypass and boolean SQLi fragments (OR 1=1, admin'--, UNION SELECT, AND
    1=1 vs AND 1=2). Vary which field you target when multiple auth fields exist.
    Proof vs baseline: observable impact in THIS response — e.g. authenticated
    session/token issued, protected user profile returned, or a SQL/DB error that
    shows the injected query executed. A generic 200 with "invalid credentials"
    or silent no-op is NOT vulnerable. Payload echoed in the body alone is NOT
    evidence. Prefer clearer operators and alternate fields after a miss.
  impact: >
    Unauthorized account access, credential disclosure, and potential full
    compromise of the authentication layer.
  category:
    name: NO_AUTH
    shortName: Broken Authentication
    displayName: Broken User Authentication (BUA)
  subCategory: SMART_AUTH_BYPASS_SQL_INJECTION
  severity: MEDIUM
  agenticTestingAllowed: true
  onlySmartTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/
    - https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa2-broken-authentication.md
  cwe:
    - CWE-287
    - CWE-89
  cve:
    - CVE-2020-24008
    - CVE-2021-45901

attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: FAST

api_selection_filters:
  response_code:
    gte: 200
    lt: 300
  method:
    neq: "OPTIONS"
  or:
    - request_payload:
        for_one:
          key:
            regex: .*
            extract: authKey
          value:
            extract: authVal
    - query_param:
        for_one:
          key:
            regex: .*
            extract: authKey
          value:
            extract: authVal

wordLists:
  sqlInjectionPayloads:
    - "' OR '1'='1"
    - "' OR 1=1--"
    - "admin'--"
    - "' UNION SELECT null, null--"

execute:
  type: single
  requests:
    - req:
        - modify_body_param:
            authKey: ${authVal}${sqlInjectionPayloads}
        - modify_query_param:
            authKey: ${authVal}${sqlInjectionPayloads}
