id: UNAUTHENTICATED_RESOURCE_ACCESS
info:
  name: "Unauthenticated access to sensitive resources"
  description: "Detects endpoints that still return successful sensitive responses after authentication material is removed."
  details: "Resources such as orders, QR codes, and reports may be intended to require login. This test strips Authorization and checks whether the endpoint continues to return 2xx with a non-empty body."
  impact: "Unauthenticated access exposes private business data and can enable further attacks without credentials."
  category:
    name: NO_AUTH
    shortName: Broken Authentication
    displayName: Broken User Authentication (BUA)
  subCategory: UNAUTHENTICATED_RESOURCE_ACCESS
  severity: HIGH
  agenticTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - "https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa2-broken-authentication.md"
  cwe:
    - CWE-306

attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: FAST

api_selection_filters:
  method:
    contains_either:
      - GET
      - POST
  response_code:
    gte: 200
    lt: 300
  response_payload:
    length:
      gt: 0
  url:
    contains_either:
      - /orders
      - /order/
      - return_qr
      - receive_report
      - /report
      - invoice
      - receipt
    not_contains:
      - health
      - login
      - signup
      - jwks

execute:
  type: single
  requests:
    - req:
        - remove_auth_header: true

validate:
  response_code:
    gte: 200
    lt: 300
  response_payload:
    length:
      gt: 0
    not_contains:
      - JWT Token required
      - Unauthorized
      - Invalid Token
      - authentication required
      - login required
      - Token required
