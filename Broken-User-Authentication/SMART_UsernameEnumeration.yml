id: SMART_USERNAME_ENUMERATION
info:
  name: Username Enumeration via Different Response Content - Smart Testing
  description: >
    Test username enumeration by mutating username/login/email (and related auth
    identifier) fields on authentication or account-lookup endpoints. Keep method,
    URL, and other headers as in the baseline; change only the identity field and
    optionally the password companion field.
  details: >
    Clone the baseline request. Across 4–5+ probes, try clearly invalid usernames,
    likely-valid common usernames (admin, test, user), and slight variants of any
    username present in the baseline. Use a constant dummy password when the body
    has one so only the identity signal changes. Proof vs baseline: this single
    probe's status, body message, error code, or structure differs from the
    baseline in a way that reveals whether the username exists (e.g. "user not
    found" vs "invalid password", different error keys, or a distinct success
    path for known users). Do NOT require comparing two probes to each other —
    judge each probe against the baseline. Identical generic "invalid credentials"
    for both valid-looking and nonsense usernames is NOT vulnerable.
  impact: >
    Exposure of valid usernames enabling targeted attacks and facilitating
    credential stuffing or brute force.
  category:
    name: NO_AUTH
    shortName: Broken Authentication
    displayName: Broken User Authentication (BUA)
  subCategory: SMART_USERNAME_ENUMERATION
  severity: MEDIUM
  agenticTestingAllowed: true
  onlySmartTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/
    - https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa2-broken-authentication.md
  cwe:
    - CWE-287
    - CWE-203
  cve:
    - CVE-2020-24008
    - CVE-2021-45901

attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: FAST

api_selection_filters:
  response_code:
    gte: 200
    lt: 300
  method:
    neq: "OPTIONS"
  or:
    - request_payload:
        for_one:
          key:
            regex: .*
            extract: userKey
    - query_param:
        for_one:
          key:
            regex: .*
            extract: userKey

wordLists:
  candidateUsernames:
    - "admin"
    - "test"
    - "nonexistentuser12345"
    - "fakeuserxyz789"

execute:
  type: single
  requests:
    - req:
        - modify_body_param:
            userKey: ${candidateUsernames}
        - modify_query_param:
            userKey: ${candidateUsernames}
