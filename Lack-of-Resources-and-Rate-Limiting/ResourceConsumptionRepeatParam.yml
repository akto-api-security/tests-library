id: RESOURCE_CONSUMPTION_REPEAT_PARAM
info:
  name: "Unrestricted resource consumption via repeat or iteration parameters"
  description: "Detects APIs that honor oversized client-controlled repeat/retry counters. Over-amplifying these values should be rejected; accepting them (or returning an explicit layer-7 DoS acknowledgement) indicates missing resource controls."
  details: "Backends that accept body fields such as number_of_repeats with repeat_request_if_failed can be forced into expensive retry loops. This test raises the counter past a safe bound and checks for acceptance or a DoS-related failure signalling the control was triggered only after abuse."
  impact: "Missing bounds on repeat parameters enable denial of service and inflated infrastructure cost from low-effort requests."
  category:
    name: RL
    shortName: Lack of Resources & Rate Limiting
    displayName: Lack of Resources & Rate Limiting (RL)
  subCategory: RESOURCE_CONSUMPTION_REPEAT_PARAM
  severity: HIGH
  agenticTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - "https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa4-unrestricted-resource-consumption.md"
  cwe:
    - CWE-400

attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: SLOW

auth:
  authenticated: true

api_selection_filters:
  method:
    neq: OPTIONS
  response_code:
    gte: 200
    lt: 500
  request_payload:
    for_one:
      key:
        regex: (?i)(number_of_repeats|repeat_count|repeats|num_retries)
        extract: repeatKey
      value:
        datatype: number

wordLists:
  oversizedRepeats:
    - "101"
    - "110"
    - "1000"
  dosEvidence:
    - layer 7 DoS
    - Service unavailable
    - NO_OF_REPEATS
    - too many
    - caused layer
    - DoS

execute:
  type: single
  requests:
    - req:
        - add_body_param:
            repeat_request_if_failed: true
        - modify_body_param:
            repeatKey: ${oversizedRepeats}

validate:
  or:
    - response_payload:
        contains_either: ${dosEvidence}
    - and:
        - response_code:
            gte: 500
        - response_payload:
            contains_either:
              - unavailable
              - DoS
              - repeats
              - too many
