id: EXCESSIVE_DATA_EXPOSURE_PROCESSING_PARAMS
info:
  name: "Excessive data exposure of internal processing parameters"
  description: "Detects API responses that leak internal processing, encoding, or pipeline configuration that clients should never see."
  details: "Some APIs serialize backend processing metadata into client responses (for example conversion_params, encoder flags, or shell-style command fragments). Exposure of these fields reveals implementation details and often enables follow-on mass assignment or command injection."
  impact: "Leaked processing parameters increase attack surface and can enable privilege escalation via mass assignment or OS command injection."
  category:
    name: SM
    shortName: Misconfiguration
    displayName: Security Misconfiguration (SM)
  subCategory: EXCESSIVE_DATA_EXPOSURE_PROCESSING_PARAMS
  severity: MEDIUM
  agenticTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - "https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa3-broken-object-property-level-authorization.md"
  cwe:
    - CWE-200
    - CWE-213

attributes:
  nature: NON_INTRUSIVE
  plan: PRO
  duration: FAST

api_selection_filters:
  method:
    contains_either:
      - GET
      - POST
      - PUT
  response_code:
    gte: 200
    lt: 300
  response_payload:
    length:
      gt: 0
    not_contains:
      - Unauthorized
      - Forbidden
      - not found
      - Video not found
    for_one:
      key:
        regex: (?i)(conversion_params|processing_params|encoding_params|transcoding_params|transcode_options|encoder_options|pipeline_config|render_params)
        extract: processingFieldKey

execute:
  type: single
  requests:
    - req: []

validate:
  response_code:
    gte: 200
    lt: 300
  response_payload:
    length:
      gt: 0
    contains_either:
      - conversion_params
      - processing_params
      - encoding_params
      - "-v codec"
      - ffmpeg
      - transcode
    not_contains:
      - Unauthorized
      - Forbidden
      - Video not found
