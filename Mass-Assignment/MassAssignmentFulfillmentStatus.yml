id: MASS_ASSIGNMENT_FULFILLMENT_STATUS
info:
  name: "Mass assignment of fulfillment or return status"
  description: "Detects mass assignment where clients can set internal fulfillment, return, or refund status fields on update APIs. Status transitions such as returned or refunded must be driven by server-side workflows, not client input."
  details: "Order and purchase update APIs often expose PUT/PATCH bodies that bind client parameters to internal state machines. When fields such as status, order_status, fulfillment_status, or return_status accept values like returned or refunded without verifying the required workflow, attackers can mark purchases as returned and trigger unauthorized credits."
  impact: "Unauthorized status manipulation enables refund fraud, inventory corruption, and direct financial loss."
  category:
    name: MA
    shortName: Mass Assignment
    displayName: Mass Assignment (MA)
  subCategory: MASS_ASSIGNMENT_FULFILLMENT_STATUS
  severity: HIGH
  agenticTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - "https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa3-broken-object-property-level-authorization.md"
    - "https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html"
  cwe:
    - CWE-915

attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: FAST

auth:
  authenticated: true

api_selection_filters:
  response_code:
    gte: 200
    lt: 300
  method:
    contains_either:
      - PUT
      - PATCH
  url:
    contains_either:
      - /orders
      - /order/
      - /purchases
      - /purchase/
  request_payload:
    length:
      gt: 0
  response_payload:
    length:
      gt: 0
    not_contains:
      - Unauthorized
      - Forbidden
      - JWT Token required
      - Invalid Token

wordLists:
  privilegedStatuses:
    - returned
    - refunded
  responseErrorList:
    - Unauthorized
    - Forbidden
    - invalid status
    - not allowed
    - JWT Token required
    - Invalid Token
    - Error

execute:
  type: single
  requests:
    - req:
        - add_body_param:
            status: ${privilegedStatuses}

validate:
  response_code:
    gte: 200
    lt: 300
  response_payload:
    length:
      gt: 0
    not_contains: ${responseErrorList}
    contains_either:
      - '"status":"returned"'
      - '"status": "returned"'
      - '"status":"refunded"'
      - '"status": "refunded"'
