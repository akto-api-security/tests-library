id: MASS_ASSIGNMENT_PROCESSING_PARAMS
info:
  name: "Mass assignment of internal processing parameters"
  description: "Detects mass assignment on update APIs where clients can write internal processing, encoding, or pipeline parameters that should be server-managed."
  details: "Resource update endpoints should allowlist only user-editable presentation fields. When undisclosed processing parameters are also bound from the request body, attackers can inject encoder flags or command fragments discovered from excessive data exposure and persist them for later execution by background workers."
  impact: "Writable processing parameters can alter server-side pipelines, enable command injection, or cause worker denial of service."
  category:
    name: MA
    shortName: Mass Assignment
    displayName: Mass Assignment (MA)
  subCategory: MASS_ASSIGNMENT_PROCESSING_PARAMS
  severity: HIGH
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - "https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa3-broken-object-property-level-authorization.md"
    - "https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html"
  cwe:
    - CWE-915

attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: FAST

auth:
  authenticated: true

api_selection_filters:
  response_code:
    gte: 200
    lt: 300
  method:
    contains_either:
      - PUT
      - PATCH
  request_payload:
    length:
      gt: 0
  or:
    - response_payload:
        for_one:
          key:
            regex: (?i)(conversion_params|processing_params|encoding_params|transcoding_params|transcode_options|encoder_options|pipeline_config|render_params)
            extract: processingFieldKey
    - request_payload:
        for_one:
          key:
            regex: (?i)(conversion_params|processing_params|encoding_params|transcoding_params|transcode_options|encoder_options|pipeline_config|render_params)
            extract: processingFieldKey
  response_payload:
    length:
      gt: 0
    not_contains:
      - Unauthorized
      - Forbidden
      - not found

wordLists:
  probeProcessingValue: "-v codec akto_probe"
  responseErrorList:
    - Unauthorized
    - Forbidden
    - not found
    - not allowed
    - Error

execute:
  type: single
  requests:
    - req:
        - add_body_param:
            ${processingFieldKey}: ${probeProcessingValue}

validate:
  response_code:
    gte: 200
    lt: 300
  response_payload:
    length:
      gt: 0
    not_contains: ${responseErrorList}
    contains_either:
      - "${probeProcessingValue}"
      - akto_probe
