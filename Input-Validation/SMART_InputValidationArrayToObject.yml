id: SMART_INPUT_VALIDATION_ARRAY_TO_OBJECT
info:
  name: Input Validation by Replacing Array with Object - Smart Testing
  description: >
    Test input validation / business-logic bypasses by mutating body or query
    parameters with invalid or unexpected values (quantity, payment, timestamps,
    coupons, null bytes, type confusion). Keep baseline method, URL, and auth
    intact; change only in-scope parameter values.
  details: >
    Clone the baseline. Across 4-5+ probes escalate mutations on business fields:
    negative/zero/huge quantities, invalid payment modes, extreme or past
    timestamps, expired/fake coupon codes, null-byte suffixes, and type confusion
    (string↔number, array↔object) when the baseline shape allows it. Vary which
    field you target. Proof vs baseline: THIS response shows the invalid input
    was accepted with a changed business outcome (e.g. discount applied, negative
    qty honored, expired coupon accepted, policy bypassed) relative to baseline.
    Generic 200 with unchanged business result, or mere echo of the payload, is
    NOT vulnerable. Prefer clearer type/value abuses after a miss.
  impact: >
    Unauthorized manipulation of business logic, financial fraud, data
    corruption, and validation bypass.
  category:
    name: INPUT
    shortName: Input Validation
    displayName: Input Validation (INPUT)
  subCategory: SMART_INPUT_VALIDATION_ARRAY_TO_OBJECT
  severity: LOW
  agenticTestingAllowed: true
  onlySmartTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/
    - https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    - https://owasp.org/www-project-developer-guide/draft/design/web_app_checklist/validate_inputs/
  cwe:
    - CWE-20
  cve:
    - CVE-2018-20679
    - CVE-2019-14271

attributes:
  nature: INTRUSIVE
  plan: STANDARD
  duration: FAST

api_selection_filters:
  response_code:
    gte: 200
    lt: 300
  method:
    neq: "OPTIONS"
  or:
    - request_payload:
        for_one:
          key:
            regex: .*
            extract: validationKey
          value:
            extract: validationValue
    - query_param:
        for_one:
          key:
            regex: .*
            extract: validationKey
          value:
            extract: validationValue

wordLists:
  validationBypassPayloads:
    - "0"
    - "-1"
    - "99999999999999"
    - "FAKECODE"
    - "%00bypass"

execute:
  type: single
  requests:
    - req:
        - modify_body_param:
            validationKey: ${validationBypassPayloads}
        - modify_query_param:
            validationKey: ${validationBypassPayloads}
