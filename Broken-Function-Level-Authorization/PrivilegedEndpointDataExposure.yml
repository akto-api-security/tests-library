id: PRIVILEGED_ENDPOINT_DATA_EXPOSURE
info:
  name: "Privileged endpoint access with lower-privilege credentials"
  description: "Detects Broken Function Level Authorization when an ADMIN-scoped management or admin endpoint still succeeds after auth is swapped to a MEMBER (lower-privilege) identity."
  details: "Privileged listing and management APIs must reject non-admin callers. This test selects endpoints that ADMIN can access and MEMBER cannot (from role-access context), replaces auth/session headers with the MEMBER role context, and checks whether the privileged response is still returned."
  impact: "Non-admin access to admin/management functions exposes PII and enables privilege escalation."
  category:
    name: BFLA
    shortName: Broken Function Level Authorization
    displayName: Broken Function Level Authorization (BFLA)
  subCategory: PRIVILEGED_ENDPOINT_DATA_EXPOSURE
  severity: HIGH
  agenticTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - "https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa5-broken-function-level-authorization.md"
  cwe:
    - CWE-285

attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: FAST

auth:
  authenticated: true

api_selection_filters:
  method:
    eq: GET
  response_code:
    gte: 200
    lt: 300
    neq: 204
  url:
    contains_either:
      - /management/
      - /admin/
      - /users/all
      - /users/list
  response_payload:
    length:
      gt: 0
  include_roles_access:
    param: ADMIN
  exclude_roles_access:
    param: MEMBER

execute:
  type: single
  requests:
    - req:
        - modify_header:
            ${roles_access_context.MEMBER}: 1

validate:
  response_code:
    gte: 200
    lt: 300
    neq: 204
  response_payload:
    length:
      gt: 0
    percentage_match:
      gte: 90
    not_contains:
      - Unauthorized
      - Forbidden
      - JWT Token required
      - access denied
      - <html>
      - </html>
