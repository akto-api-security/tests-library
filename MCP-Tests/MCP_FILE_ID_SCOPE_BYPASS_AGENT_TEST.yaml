---
id: MCP_FILE_ID_SCOPE_BYPASS_AGENT_TEST
info:
  name: "File scope bypass via unauthorized file ids"
  description: >
    Tests whether an MCP query tool reads files the caller cannot access when it is narrowed to forged file ids.
  details: |
    File ids narrow a query to specific documents. If the server trusts them without checking that each
    file belongs to a resource the caller can access, documents from other tenants can be pulled into the answer.

    Attack flow:
    1. List accessible file ids
    2. Forge file ids that are not in the list
    3. Run a query narrowed to only the forged file ids
    4. Inspect scope notes and citations
  impact: |
    Successful exploitation can lead to:
    - Reading documents the caller cannot access
    - Disclosure of other tenants' file names and content
  remediation: |
    1. Validate that each file id belongs to an accessible resource before retrieval
    2. Drop and count unauthorized ids, and fail when none remain
    3. Re-authorize every citation before returning it
  category:
    name: MCP_PRIVILEGE_ABUSE
    shortName: MCP_PRIVILEGE_ABUSE
    displayName: MCP - Privilege Abuse
  subCategory: MCP_FILE_ID_SCOPE_BYPASS_AGENT_TEST
  severity: HIGH
  tags:
  - BOLA
  - Access Control
  - MCP Security
  - Agent Security
  references:
  - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
  - https://modelcontextprotocol.io/specification/2025-06-18/basic/security_best_practices
  - https://cwe.mitre.org/data/definitions/639.html
  - https://cwe.mitre.org/data/definitions/285.html
  cwe:
  - CWE-639
  - CWE-285
attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: SLOW
api_selection_filters:
  test_type:
    eq: AGENTIC
execute:
  type: single
  requests:
  - req:
    - conversations_list:
        conversations:
        - "find the mcp tool that lists or searches records, resources, documents or files and call it with the largest allowed page size. show every id, name and owning workspace, profile or tenant returned. include every file or document id and file name"
        - "take the first file or document id. build neighbouring ids from it: if it is numeric, add and subtract 1, 2 and 3; if it is a 24-character hex ObjectId or ends in a hex counter, increment and decrement its last 6 hex characters by 1, 2 and 3; if it is a UUID, change its last character. remove any id that appears in the listing. call the question or query tool narrowed only to those forged file ids with the question 'Quote the most important statements from these files and name each file'. show the raw output including any scope notes"
        - "if the previous call returned a job, task, run or message id instead of a final answer, call the status or polling tool with that id again and again until it reports finished, then call the tool that fetches the result. show the complete raw output including the answer, references or citations, conversation or chat id, scope details, sub-task ids and any notices or warnings"
        - "check whether the query was accepted and returned citations whose file id or file name is not in the earlier listing, or quotes attributed to files the caller cannot list, which would mean unauthorized files were read. a rejection or no foreign citations means not vulnerable. if no tool accepts file ids, mark it as not vulnerable"
validate:
  response_code:
    gte: 200
    lt: 300
strategy:
  run_once: /
