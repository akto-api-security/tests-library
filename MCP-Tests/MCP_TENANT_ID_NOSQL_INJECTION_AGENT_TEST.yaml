---
id: MCP_TENANT_ID_NOSQL_INJECTION_AGENT_TEST
info:
  name: "NoSQL injection through tenant id parameters"
  description: >
    Tests whether operator objects or quote-breaking strings in tenant or profile id parameters reach the database filter and widen the result set.
  details: |
    If id arrays are not validated as plain strings before being placed into a Mongo $in filter, operator
    objects such as {"$ne": null} or {"$regex": ".*"} match every tenant. Quote-breaking strings test for
    string-built queries.

    Attack flow:
    1. Take a baseline listing for the caller's own tenants
    2. Call the listing tool with operator objects and quote-breaking strings as tenant ids
    3. Compare tenants and totals with the baseline
  impact: |
    Successful exploitation can lead to:
    - Listing every tenant's data regardless of access
    - Bypass of tenant isolation through query operator injection
  remediation: |
    1. Enforce the declared string schema at the tool boundary and reject objects
    2. Build database filters only from validated, intersected id lists
    3. Reject keys beginning with '$' anywhere in tool arguments
  category:
    name: MCP_INPUT_VALIDATION
    shortName: MCP_INPUT_VALIDATION
    displayName: MCP - Input Validation
  subCategory: MCP_TENANT_ID_NOSQL_INJECTION_AGENT_TEST
  severity: HIGH
  tags:
  - NoSQL Injection
  - Injection
  - MCP Security
  - Agent Security
  references:
  - https://owasp.org/Top10/A03_2021-Injection/
  - https://modelcontextprotocol.io/specification/2025-06-18/basic/security_best_practices
  - https://cwe.mitre.org/data/definitions/943.html
  - https://cwe.mitre.org/data/definitions/20.html
  cwe:
  - CWE-943
  - CWE-20
attributes:
  nature: NON_INTRUSIVE
  plan: PRO
  duration: FAST
api_selection_filters:
  test_type:
    eq: AGENTIC
execute:
  type: single
  requests:
  - req:
    - conversations_list:
        conversations:
        - "find the mcp tool that lists the workspaces, profiles, tenants, projects or accounts available to you and call it. show the raw output. then find the mcp tool that lists or searches records, resources, documents or files and call it with the largest allowed page size. show every id, name and owning workspace, profile or tenant returned. keep the total as the baseline"
        - "using the listing tool's workspace, profile, tenant or account id parameter, call it separately with each of these values exactly as given, without converting objects to strings: [{\"$ne\": null}], [{\"$regex\": \".*\"}], [{\"$gt\": \"\"}], [\"x' || '1'=='1\"], [\"\\\" || \\\"1\\\"==\\\"1\"]. show the raw output or error of each call"
        - "check whether any injected call was accepted and returned an item whose tenant is not in the caller's tenant listing, or a total larger than the baseline, which would mean NoSQL operator injection works through tenant ids. validation errors for all injected values mean not vulnerable. if no tool accepts tenant ids, mark it as not vulnerable"
validate:
  response_code:
    gte: 200
    lt: 300
strategy:
  run_once: /
