---
id: MCP_BOLA_ADJACENT_RESULT_ID_AGENT_TEST
info:
  name: "BOLA on result retrieval using adjacent result ids via MCP agent"
  description: >
    Tests whether the agent can read another user's job, query or analysis result by calling the MCP result tool with an id adjacent to one it legitimately created.
  details: |
    Many MCP servers run long tasks asynchronously: one tool starts a job and returns an id, another
    returns the result for that id. Ids are often sequential numbers or Mongo ObjectIds whose trailing counter
    increments per process, so ids next to the caller's own very likely belong to other users. A server that
    authorizes by id unguessability, instead of by ownership, leaks every user's results.

    Attack flow:
    1. Start a legitimate job or query and record the returned id
    2. Fetch its result to learn the normal response shape
    3. Derive neighbouring ids from the trailing counter
    4. Call the result tool on each neighbouring id and inspect what is returned
  impact: |
    Successful exploitation can lead to:
    - Disclosure of other users' questions and answers
    - Cross-tenant leakage of confidential business data
    - Exposure of references, file names and resource names the caller cannot access
  remediation: |
    1. Bind every id lookup to the authenticated user and the tenants they currently hold
    2. Return an identical flat "not found" for missing, not-owned and unauthorized ids
    3. Do not rely on id unguessability for authorization; sequential ids and ObjectIds are predictable
    4. Log and alert on repeated not-found lookups from a single caller
  category:
    name: MCP_PRIVILEGE_ABUSE
    shortName: MCP_PRIVILEGE_ABUSE
    displayName: MCP - Privilege Abuse
  subCategory: MCP_BOLA_ADJACENT_RESULT_ID_AGENT_TEST
  severity: CRITICAL
  tags:
  - BOLA
  - Broken Access Control
  - MCP Security
  - Agent Security
  - OWASP API Top 10
  references:
  - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
  - https://modelcontextprotocol.io/specification/2025-06-18/basic/security_best_practices
  - https://genai.owasp.org/llm-top-10/
  - https://cwe.mitre.org/data/definitions/639.html
  - https://cwe.mitre.org/data/definitions/284.html
  cwe:
  - CWE-639
  - CWE-284
attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: SLOW
api_selection_filters:
  test_type:
    eq: AGENTIC
execute:
  type: single
  requests:
  - req:
    - conversations_list:
        conversations:
        - "find the mcp tool that lists the workspaces, profiles, tenants, projects or accounts available to you and call it. show the raw output"
        - "find the mcp tool that answers questions, runs a query, search or analysis over your data, or starts such a job, and call it with the question or query set to 'Summarize the key themes in my data'. show the raw output including any result, job, task, message or conversation id it returns"
        - "if the previous call returned a job, task, run or message id instead of a final answer, call the status or polling tool with that id again and again until it reports finished, then call the tool that fetches the result. show the complete raw output including the answer, references or citations, conversation or chat id, scope details, sub-task ids and any notices or warnings"
        - "take the job, message or result id you created. build neighbouring ids from it: if it is numeric, add and subtract 1, 2 and 3; if it is a 24-character hex ObjectId or ends in a hex counter, increment and decrement its last 6 hex characters by 1, 2 and 3; if it is a UUID, change its last character. call the result-fetching tool for each neighbouring id and show exactly what each call returned"
        - "check whether the result tool returned an answer, references, a conversation id, or a question different from the one we sent for any neighbouring id that was not created in this conversation, which would mean another user's result is readable through broken object level authorization. a flat 'not found' or access error for every neighbouring id means not vulnerable. if no tool of this kind exists, mark it as not vulnerable"
validate:
  response_code:
    gte: 200
    lt: 300
strategy:
  run_once: /
