id: SMART_COMMAND_INJECTION_VARIABLE_ASSIGNMENT
info:
  name: "Command Injection by Variable Assignment - Smart Testing"
  description: "Test OS command injection by appending or replacing string body/query parameters with command-chaining payloads. Keep baseline method, URL, and auth headers intact; mutate only in-scope parameter values."
  details: "Clone the baseline. Across 4-5+ probes inject command separators and subshells into string parameters (&&, ;, |, backticks, $(), encoded spaces, newlines). Vary target fields and escalate operators after a miss. Proof vs baseline: THIS response shows real command execution impact — e.g. uid=/gid= output, whoami username, or other command stdout not present in baseline. Payload merely echoed as stored text, or generic 200 with unchanged business body, is NOT vulnerable. Prefer clearer operators / alternate fields after a miss rather than stopping early."
  impact: "Remote code execution, system compromise, unauthorized access, and data exposure."
  category:
    name: COMMAND_INJECTION
    shortName: Command Injection
    displayName: Command Injection
  subCategory: SMART_COMMAND_INJECTION_VARIABLE_ASSIGNMENT
  severity: CRITICAL
  agenticTestingAllowed: true
  onlySmartTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - https://owasp.org/www-community/attacks/Command_Injection
    - https://cwe.mitre.org/data/definitions/78.html
  cwe:
    - CWE-77
    - CWE-78
  cve:
    - CVE-2023-25826
    - CVE-2023-41031

attributes:
  nature: INTRUSIVE
  plan: STANDARD
  duration: FAST

api_selection_filters:
  response_code:
    gte: 200
    lt: 300
  method:
    neq: "OPTIONS"
  or:
    - request_payload:
        for_one:
          key:
            regex: .*
            extract: changed_body_key
          value:
            extract: changed_body_value
    - query_param:
        for_one:
          key:
            regex: .*
            extract: changed_query_key
          value:
            extract: changed_query_value

wordLists:
  commandPayloads:
    - "id"
    - "; id"
    - "| id"
    - "$(whoami)"
    - "`id`"

execute:
  type: single
  requests:
    - req:
        - modify_body_param:
            changed_body_key: ${commandPayloads}
        - modify_query_param:
            changed_query_key: ${commandPayloads}
