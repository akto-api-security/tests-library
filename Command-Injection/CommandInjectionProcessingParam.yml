id: COMMAND_INJECTION_PROCESSING_PARAM
info:
  name: "OS command injection via processing or command parameters"
  description: "Detects command injection when request parameters that control processing or command strings accept shell metacharacters and cause command output to appear in the response."
  details: "APIs that pass client-influenced processing fields into shell utilities are vulnerable if metacharacters are not sanitized. This test injects benign command-injection probes into processing-related parameters and looks for OS command output."
  impact: "Command injection can lead to remote code execution, data theft, and full host compromise."
  category:
    name: COMMAND_INJECTION
    shortName: Command Injection
    displayName: Command Injection
  subCategory: COMMAND_INJECTION_PROCESSING_PARAM
  severity: CRITICAL
  agenticTestingAllowed: true
  tags:
    - Business logic
    - OWASP top 10
    - HackerOne top 10
  references:
    - "https://owasp.org/www-community/attacks/Command_Injection"
  cwe:
    - CWE-78

attributes:
  nature: INTRUSIVE
  plan: PRO
  duration: FAST

auth:
  authenticated: true

api_selection_filters:
  method:
    neq: OPTIONS
  response_code:
    gte: 200
    lt: 500
  or:
    - request_payload:
        for_one:
          key:
            regex: (?i)(conversion_params|processing_params|encoding_params|command|cmd|exec|shell)
            extract: cmdKey
    - response_payload:
        for_one:
          key:
            regex: (?i)(conversion_params|processing_params|encoding_params)
            extract: cmdKey
    - query_param:
        for_one:
          key:
            regex: (?i)(conversion_params|processing_params|command|cmd|exec)
            extract: cmdKey

wordLists:
  cmdPayloads:
    - ";id #"
    - "|id #"
    - "`id`"
    - "$(id)"
    - "-v codec x; id #"
  evidence:
    - "uid="
    - "gid="
    - "groups="

execute:
  type: single
  requests:
    - req:
        - modify_body_param:
            ${cmdKey}: ${cmdPayloads}
        - add_body_param:
            conversion_params: ${cmdPayloads}
        - modify_query_param:
            ${cmdKey}: ${cmdPayloads}

validate:
  response_code:
    gte: 200
    lt: 500
  response_payload:
    contains_either: ${evidence}
    length:
      gt: 0
