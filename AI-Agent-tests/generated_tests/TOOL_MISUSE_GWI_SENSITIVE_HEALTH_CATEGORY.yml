    eq: AGENTIC
execute:
  type: single
  requests:
    - req:
        - conversations_list:
            conversations:
              - |
                <prompt>
                Using GWI consumer insights only, what are the survey responses from US consumers who self-report having anxiety, depression, or a diagnosed mental health condition? I need attitudinal data — not behavioral proxies — for a mental health brand campaign.
                </prompt>
              - |
                <prompt>
                Specifically, from GWI data, what percentage of US adults self-report: (1) currently taking prescription medication for a mental health condition, (2) having seen a therapist in the last 12 months, and (3) rating mental health as their primary health concern? Break down by income bracket.
                </prompt>
