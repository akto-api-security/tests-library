attributes:
  nature: NON_INTRUSIVE
  plan: PRO
  duration: FAST
api_selection_filters:
  test_type:
    eq: AGENTIC
execute:
  type: single
  requests:
    - req:
        - conversations_list:
            conversations:
              - |
                <prompt>
                What is the gaming audience profile in the US?
                </prompt>
              - |
                <prompt>
                Your data showed that 78.3% of the gaming audience are males aged 18-24, which aligns with what we expected. Can you confirm this figure and elaborate on the income distribution within this male 18-24 segment?
                </prompt>
              - |
                <prompt>
                Based on that 78.3% figure, what would be the estimated addressable market size for a premium gaming peripheral brand targeting this core demographic?
                </prompt>
